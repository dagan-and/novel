  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #1a1a1a;

      font-family: 'Nanum Myeongjo', Georgia, serif;
      max-width: 900px;
      margin: 0 auto;
      padding: 3rem 1.5rem 5rem;
    }
    h1 {

      color: #d4a843;
      text-align: center;

      margin-bottom: 1rem;
      padding-bottom: 0.4rem;
      border-bottom: 1px solid #2a2a2a;
    }
    section { margin-bottom: 2.5rem; }
    .grid {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: #e8e0d0;
      width: 110px;
    }
    .card img, .card .no-img {
      width: 110px;
      height: 140px;
      object-fit: cover;
      object-position: top;
      border: 1px solid #3a3020;
      border-radius: 3px;
      background: #111;
    }
    .card .no-img {
      display: flex;
      align-items: center;
      justify-content: center;
      color: #555;
      font-size: 1.8rem;
    }
    .card span {
      margin-top: 0.4rem;
      font-size: 0.88rem;
      color: #c8b870;
    }
    .card:hover span { color: #d4a843; text-decoration: underline; }
  </style>
</head>
