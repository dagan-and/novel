plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.google.services)
    alias(libs.plugins.firebase.appdistribution)
    id 'kotlin-kapt'
}

def firebaseDistributionGroups = providers.gradleProperty("firebaseDistributionGroups").orElse("yubu").get()
def firebaseDistributionTesters = providers.gradleProperty("firebaseDistributionTesters").orNull
def firebaseReleaseNotes = providers.gradleProperty("firebaseReleaseNotes").orNull
def firebaseReleaseNotesFile = providers.gradleProperty("firebaseReleaseNotesFile").orNull
def firebaseServiceCredentialsFile = providers.gradleProperty("firebaseServiceCredentialsFile").orNull

def keystorePropertiesFile = file("../keystore.properties")
if (!keystorePropertiesFile.exists()) {
    keystorePropertiesFile = file("/Users/kys1207/AndroidStudioProjects/MyHome/keystore.properties")
}
def keystoreProperties = new Properties()
def hasKeystoreProperties = keystorePropertiesFile.exists()
if (hasKeystoreProperties) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
def resolveKeystoreFile = { propertiesFile, storeFilePath ->
    def configuredFile = new File(storeFilePath)
    configuredFile.isAbsolute() ? configuredFile : new File(propertiesFile.parentFile, storeFilePath)
}

android {
    namespace "com.kys.videomanager"
    compileSdk 36

    defaultConfig {
        applicationId "com.kys.videomanager"
        minSdk 24
        targetSdk 34
        versionCode 6
        versionName "1.0.5"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        if (hasKeystoreProperties) {
            release {
                storeFile resolveKeystoreFile(keystorePropertiesFile, keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasKeystoreProperties) {
                signingConfig signingConfigs.release
            }
            firebaseAppDistribution {
                artifactType = "APK"
                groups = firebaseDistributionGroups
                if (firebaseDistributionTesters) {
                    testers = firebaseDistributionTesters
                }
                if (firebaseReleaseNotesFile) {
                    releaseNotesFile = firebaseReleaseNotesFile
                } else {
                    releaseNotes = firebaseReleaseNotes ?: "VideoManager release"
                }
                if (firebaseServiceCredentialsFile) {
                    serviceCredentialsFile = firebaseServiceCredentialsFile
                }
            }
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

