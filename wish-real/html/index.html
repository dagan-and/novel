<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>wish-real 목차</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #171717;
      color: #ece5dc;
      font-family: "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
      word-break: keep-all;
    }
    main {
      max-width: 920px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 34px 18px 72px;
    }
    .subtitle {
      margin: 0 0 22px;
      color: #afa69d;
      text-align: center;
      font-weight: 800;
    }
    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 170px;
      gap: 18px;
      align-items: start;
    }
    .batch {
      margin-bottom: 14px;
      padding: 16px;
      border: 1px solid #473f39;
      border-radius: 8px;
      background: #22201f;
    }
    .batch h2 {
      margin: 0 0 12px;
      color: #d7a36c;
      font-size: 1rem;
      letter-spacing: 0;
    }
    .episode-links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .episode-links a, .utility a {
      border: 1px solid #473f39;
      border-radius: 8px;
      color: #ece5dc;
      text-decoration: none;
      background: rgba(215, 163, 108, 0.08);
    }
    .episode-links a {
      min-width: 42px;
      padding: 8px 10px;
      text-align: center;
      font-weight: 800;
    }
    .utility {
      display: grid;
      gap: 10px;
    }
    .utility a {
      padding: 12px 14px;
      color: #d7a36c;
      font-weight: 900;
      text-align: center;
    }
    a:hover {
      border-color: #d7a36c;
      text-decoration: underline;
    }
    @media (max-width: 700px) {
      main { padding: 20px 10px 54px; }
      .layout { grid-template-columns: 1fr; }
      .utility { order: -1; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
