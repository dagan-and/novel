<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>인물</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 120%; }
    body {
      background: #111417;
      color: #e8e1d5;
      font-family: 'Pretendard', 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
      font-size: 1rem;
      width: 100%;
      height: 100vh;
      margin: 0 auto;
      padding: 1.2rem 1.5rem;
      word-break: keep-all;
      overflow: hidden;
    }
    h1 { font-size: 1.8rem; color: #79b8b2; text-align: center; margin-bottom: 3rem; letter-spacing: 0.02em; }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      grid-template-rows: repeat(2, minmax(0, 1fr));
      gap: 0.9rem;
      height: 100%;
    }
    .card {
      display: flex; flex-direction: column; justify-content: flex-end;
      text-decoration: none; color: #e8e1d5;
      min-height: 0;
      overflow: hidden;
      position: relative;
      border: 1px solid #30383a;
      border-radius: 8px;
      background:
        linear-gradient(180deg, rgba(17,20,23,0) 42%, rgba(17,20,23,0.92) 100%),
        #181d20;
      box-shadow: 0 18px 38px rgba(0,0,0,0.28);
    }
    .card img, .card .no-img {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      object-fit: cover; object-position: top;
      border: 0; border-radius: 0; background: #181d20;
      transition: transform 0.24s ease, filter 0.24s ease;
    }
    .card .no-img {
      display: flex; align-items: center; justify-content: center;
      color: #8f9996; font-size: 3rem;
    }
    .card span, .card em { position: relative; z-index: 1; margin-left: 1rem; margin-right: 1rem; }
    .card span { margin-bottom: 0.12rem; font-size: 1.22rem; color: #dff7f1; font-weight: 800; text-shadow: 0 2px 10px rgba(0,0,0,0.7); }
    .card em { margin-bottom: 1rem; font-size: 0.9rem; color: #b9c7c3; font-style: normal; }
    .card:hover img { transform: scale(1.035); filter: brightness(1.08); }
    .card:hover span { color: #8fd0c9; text-decoration: underline; }
    @media (max-width: 760px) {
      body { padding: 0.75rem 0.55rem; }
      .grid { gap: 0.45rem; }
      .card span, .card em { margin-left: 0.55rem; margin-right: 0.55rem; }
      .card span { font-size: clamp(0.8rem, 3.6vw, 1.05rem); }
      .card em { margin-bottom: 0.55rem; font-size: clamp(0.68rem, 3vw, 0.82rem); }
    }
    @media (max-width: 460px) {
      body { padding: 0.55rem 0.35rem; }
      .grid { gap: 0.35rem; }
    }
  </style>
</head>
<body>
  <div class="grid">
    <a class="card" href="characters/박미현.html"><img src="../images/characters/박미현.png" alt="박미현"><span>박미현</span><em>메인</em></a>
    <a class="card" href="characters/유하린.html"><img src="../images/characters/유하린.png" alt="유하린"><span>유하린</span><em>후보</em></a>
    <a class="card" href="characters/정다은.html"><img src="../images/characters/정다은.png" alt="정다은"><span>정다은</span><em>후보</em></a>
    <a class="card" href="characters/서나윤.html"><img src="../images/characters/서나윤.png" alt="서나윤"><span>서나윤</span><em>후보</em></a>
    <a class="card" href="characters/이재인.html"><img src="../images/characters/이재인.png" alt="이재인"><span>이재인</span><em>추격권 진입</em></a>
  </div>
</body>
</html>
