<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Novel Archive</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #181615;
      --panel: #24201e;
      --text: #e5ddd4;
      --muted: #a89d92;
      --accent: #d59b72;
      --line: #3a342f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: radial-gradient(circle at top, #26211f 0%, var(--bg) 60%);
      color: var(--text);
      font-family: "Iowan Old Style", "Apple SD Gothic Neo", "Noto Serif KR", serif;
    }
    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 56px 20px 80px;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 2.4rem;
      line-height: 1.2;
    }
    p {
      margin: 0 0 18px;
      color: var(--muted);
      line-height: 1.8;
    }
    ul {
      list-style: none;
      margin: 28px 0 0;
      padding: 0;
      display: grid;
      gap: 14px;
    }
    a {
      display: block;
      padding: 18px 20px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.03);
      color: var(--text);
      text-decoration: none;
    }
    a strong {
      display: block;
      margin-bottom: 6px;
      color: var(--accent);
      font-size: 1.05rem;
    }
    a span {
      color: var(--muted);
      line-height: 1.7;
    }
  </style>
</head>
<body>
  <main>
    <h1>Novel Archive</h1>
    <p>공개된 작품과 HTML 뷰어 모음입니다.</p>
    <ul>
      <li>
        <a href="/novel/dual_life/html/001-100/ep.001.html">
          <strong>Dual Life</strong>
          <span>이중 현실 생활소설 1화부터 보기</span>
        </a>
      </li>
    </ul>
  </main>
</body>
</html>
