<p>키워드: 분기 방문 / 미팅룸 / 클립보드 뒤집음 / 빈 의자</p>

<div class="divider">* * *</div>

<p>분기 방문일이었다. 수인이 미팅룸 문을 먼저 열었다. 클립보드를 테이블 위에 내려뒀다. 체크리스트 첫 번째 칸이 비어 있었다. 용식이 들어와 맞은편 의자에 앉았다. 수인이 클립보드를 뒤집어 테이블 위에 내려뒀다. 체크리스트가 아래를 향했다. 용식이 뒤집어진 클립보드 쪽을 봤다. 수인이 팔꿈치를 테이블에 올렸다. 미팅룸 안에 두 사람이었다.</p>
