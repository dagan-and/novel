<head>
  <meta charset="UTF-8">

  <title>인물</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 120%; }
    body {
      background: #111417;
      color: #e8e1d5;
      font-family: 'Pretendard', 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
      font-size: 1rem;
      max-width: 900px;
      margin: 0 auto;
      padding: 1rem 1rem max(1rem, env(safe-area-inset-bottom));
      word-break: keep-all;
      overflow-y: auto;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.75rem;
    }
    .card {
      display: flex; flex-direction: column; justify-content: flex-end;
      text-decoration: none; color: #e8e1d5;
      height: clamp(180px, 42vh, 400px);
      overflow: hidden;
      position: relative;
      border: 1px solid #30383a;
      border-radius: 8px;
      background:
        linear-gradient(180deg, rgba(17,20,23,0) 22%, rgba(17,20,23,0.72) 70%, rgba(17,20,23,0.96) 100%),
        #181d20;
      box-shadow: 0 14px 32px rgba(0,0,0,0.26);
    }
    .card img, .card .no-img {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover; object-position: top;
      border: 0; border-radius: 0; background: #181d20;
      transition: transform 0.24s ease, filter 0.24s ease;
    }
    .card .no-img {
      display: flex; align-items: center; justify-content: center;
      color: #8f9996; font-size: 3rem;
    }
    .card span, .card em {
      position: relative; z-index: 1;
      margin-left: 0.75rem; margin-right: 0.75rem;
      -webkit-text-stroke: 0.45px rgba(0,0,0,0.9);
      text-shadow: 0 1px 2px rgba(0,0,0,1), 0 3px 12px rgba(0,0,0,0.95);
    }
    .card span {
      margin-bottom: 0.1rem;
      font-size: 1.1rem; color: #f2fffb; font-weight: 900;
    }
    .card em {
      margin-bottom: 0.7rem;
      font-size: 0.82rem; color: #e3eee9; font-style: normal; font-weight: 700;
    }
    .card:hover img { transform: scale(1.035); filter: brightness(1.08); }
    .card:hover span { color: #8fd0c9; text-decoration: underline; }
    @media (max-width: 760px) {
      body { padding: 0.65rem 0.5rem max(0.65rem, env(safe-area-inset-bottom)); }
      .grid { gap: 0.45rem; }
      .card span, .card em { margin-left: 0.45rem; margin-right: 0.45rem; }
      .card span { font-size: clamp(0.76rem, 3.4vw, 1rem); }
      .card em { margin-bottom: 0.45rem; font-size: clamp(0.62rem, 2.8vw, 0.76rem); }
    }
    @media (max-width: 460px) {
      body { padding: 0.45rem 0.3rem max(0.45rem, env(safe-area-inset-bottom)); }
      .grid { gap: 0.32rem; }
    }
  </style>

  <script>
    (function() {
      var grid  = document.getElementById('charGrid');
      var cards = Array.from(grid.children);

      // 카드 순서 셔플 (Fisher-Yates)
      for (var i = cards.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = cards[i]; cards[i] = cards[j]; cards[j] = t;
      }
      cards.forEach(function(c) { grid.appendChild(c); });

      // 카드별 랜덤 이미지 선택
      cards.forEach(function(card) {
        var imgs = JSON.parse(card.dataset.images || '[]');
        if (!imgs.length) return;
        var src = imgs[Math.floor(Math.random() * imgs.length)];
        var img = card.querySelector('img');
        if (img) img.src = src;
      });
    })();
  </script>
